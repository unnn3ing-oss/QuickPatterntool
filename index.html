<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片套版產生器</title>
<style>
  @font-face {
    font-family: "WHZ-Heavy";
    src: url("whz-heavy.ttf") format("truetype");
    font-display: swap;
  }
:root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e2e4e9;
    --accent: #004aad;
    --accent-dark: #003a87;
    --success: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card-bg: #21242b;
      --text: #e6e8eb;
      --muted: #9aa0aa;
      --border: #333844;
      --accent: #3d7fe0;
      --accent-dark: #004aad;
      --success: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0; color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 110px;
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
  .field { margin-bottom: 16px; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 20px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .dropzone.drag { border-color: var(--accent); color: var(--accent); }
  .dropzone input { display: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .btn-row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 10px 16px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .canvas-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    justify-content: center;
  }
  canvas {
    width: 100%;
    max-width: 520px;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    background: #ddd repeating-conic-gradient(#ccc 0% 25%, #ddd 0% 50%) 50% / 24px 24px;
  }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
  .mode-switch { display: flex; gap: 6px; margin-bottom: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .mode-btn { flex: 1; background: transparent; border: none; border-radius: 7px; padding: 8px 10px; color: var(--muted); font-weight: 600; }
  .mode-btn.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .batch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .batch-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }
  .batch-item img { width: 100%; aspect-ratio: 1/1; display: block; object-fit: cover; }
  .batch-item .meta { padding: 6px 8px; }
  .batch-item .meta .name { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
  .batch-item button { width: 100%; padding: 6px; font-size: 12px; }
  .batch-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; width: 100%; }
  .batch-item-block {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    background: var(--bg);
  }
  .batch-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
    background: var(--bg);
    cursor: pointer;
  }
  .batch-item-row:hover { border-color: var(--accent); }
  .batch-item-row .row-thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--card-bg);
  }
  .batch-item-row .row-title {
    flex: 1;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .batch-item-row .row-badge {
    font-size: 11px;
    color: var(--success);
    font-weight: 600;
    flex-shrink: 0;
  }
  .batch-item-row .row-remove {
    padding: 4px 10px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .batch-item-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .batch-item-head .label { font-size: 13px; font-weight: 600; }
  .batch-item-head button {
    padding: 4px 10px;
    font-size: 12px;
    border-color: var(--border);
  }
  .batch-item-block textarea { min-height: 80px; margin-bottom: 10px; }
  .batch-item-block .dropzone { padding: 14px 10px; font-size: 12px; }
  .batch-item-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; display: block; }
  .bg-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .bg-toggle button { flex: 1; padding: 6px; font-size: 12px; }
  .bg-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    border: 2px dashed var(--border);
    border-radius: 10px;
  }
  .color-swatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    border: 2px solid transparent;
    box-sizing: border-box;
  }
  .color-swatch.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>圖片套版產生器</h1>
    <p class="sub">貼上標題（換行照原樣分行）、選擇娛樂（粉框）或新聞（藍框），上傳圖片或選純色背景，自動套上 TVBS 版型</p>
  </header>

  <div class="layout">
    <div class="card">
      <div class="mode-switch">
        <button type="button" class="mode-btn active" id="modeSingleBtn">單張</button>
        <button type="button" class="mode-btn" id="modeBatchBtn">批次</button>
      </div>

      <div id="singleFields">
        <div class="field">
          <label>類別</label>
          <div class="bg-toggle" id="singleFrameToggle">
            <button type="button" data-frame="news">新聞（藍框）</button>
            <button type="button" class="active" data-frame="entertainment">娛樂（粉框）</button>
          </div>
        </div>

        <div class="field">
          <label for="title">標題（Enter 換行）</label>
          <textarea id="title" placeholder="黑人心梗主因曝！&#10;醫示警「1行為」&#10;悄悄埋下未爆彈"></textarea>
        </div>

        <div class="field">
          <label>字級（對照 Canva 字級）</label>
          <input type="range" id="fontSize" min="50" max="70" value="50" style="width:100%">
          <div class="hint">目前 Canva 字級 <span id="fontSizeVal">50</span>（未調整時依背景類型自動預設：圖片 50／純色 60）</div>
        </div>

        <div class="field">
          <label>背景</label>
          <div id="singleBgPicker"></div>
        </div>

        <div class="btn-row">
          <button class="primary" id="downloadBtn" disabled>下載圖片</button>
          <button id="resetBtn">清除重來</button>
        </div>
      </div>

      <div id="batchFields" style="display:none">
        <div class="btn-row" style="margin-top:0; margin-bottom:20px">
          <button class="primary" id="batchGenerateBtn" style="flex:1">全部完成</button>
          <button id="batchDownloadAllBtn" style="flex:1" disabled>全部下載</button>
        </div>

        <div id="batchItemsList"></div>

        <div class="btn-row">
          <button id="addBatchItemBtn">＋ 再做一張</button>
        </div>

        <div class="btn-row">
          <button id="batchResetBtn">清除重來</button>
        </div>
      </div>
    </div>

    <div>
      <div id="singlePreview">
        <div class="canvas-wrap">
          <canvas id="canvas" width="1080" height="1080"></canvas>
        </div>
        <div class="status" id="status">請先上傳圖片並輸入標題</div>
      </div>

      <div id="batchPreview" style="display:none">
        <div class="canvas-wrap">
          <canvas id="batchCanvas" width="1080" height="1080"></canvas>
        </div>
        <div class="status" id="batchStatus">按某一組的「完成」後，預覽會顯示在這裡</div>
      </div>
    </div>
  </div>
</div>

<script>
const SIZE = 1080;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('title');
const fontSizeInput = document.getElementById('fontSize');
const fontSizeVal = document.getElementById('fontSizeVal');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

const PRESET_COLORS = ['#c80000','#ff3916','#5fa646','#4c8b74','#ff9900','#1c6294','#cb6ce6','#d84040','#ff7ead','#004aad','#000000','#48413f','#a6a6a6'];

function drawImageCover(targetCtx, image) {
  const canvasRatio = 1;
  const imgRatio = image.width / image.height;
  let sx, sy, sw, sh;
  if (imgRatio > canvasRatio) {
    sh = image.height;
    sw = sh * canvasRatio;
    sx = (image.width - sw) / 2;
    sy = 0;
  } else {
    sw = image.width;
    sh = sw / canvasRatio;
    sx = 0;
    sy = (image.height - sh) / 2;
  }
  targetCtx.drawImage(image, sx, sy, sw, sh, 0, 0, SIZE, SIZE);
}

function drawGradient(targetCtx) {
  const grad = targetCtx.createLinearGradient(0, 0, 0, SIZE);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.45, 'rgba(0,0,0,0)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0.75)');
  targetCtx.fillStyle = grad;
  targetCtx.fillRect(0, 0, SIZE, SIZE);
}

function drawRibbon(targetCtx, frame) {
  const im = frame === 'news' ? ribbonNewsImg : ribbonImg;
  if (!im) return;
  targetCtx.drawImage(im, SIZE - RIBBON_W, 0, RIBBON_W, RIBBON_H);
}

let logoImg = null;
const logoReady = new Promise(resolve => {
  const im = new Image();
  im.onload = () => { logoImg = im; resolve(); };
  im.src = LOGO_DATA_URI;
});

function drawLogoBottom(targetCtx) {
  if (!logoImg) return;
  targetCtx.drawImage(logoImg, LOGO_X, LOGO_Y, LOGO_W, LOGO_H);
}

const FONT_STACK = `"WHZ-Heavy", "Microsoft JhengHei", "PMingLiU", sans-serif`;
// Canvas text doesn't wait for a @font-face to finish loading on its own —
// the first draw silently falls back to the next font in the stack. Force
// the load explicitly and await this promise before any canvas text draw
// that gets captured immediately (e.g. batch "完成"), so it never needs a
// second click to pick up the real font.
const whzFontReady = document.fonts.load(`67px "WHZ-Heavy"`).catch(() => {});
const BOX_CENTER = 839;      // fixed vertical center of the headline block (measured from real exports, 2-line and 3-line both anchor here)
const LINE_HEIGHT_RATIO = 93 / 67; // measured line-height : font-size ratio

// The font-size slider is labelled in Canva's own "字級" units (matching what
// the user sees in Canva), not raw canvas px. Canva 字級 50 measured out to
// 67px on our 1080 canvas, giving this conversion factor.
const CANVA_TO_PX = 67 / 50;
const DEFAULT_CANVA_SIZE_IMAGE = 50; // Canva 字級 50 — image/ribbon frame
const DEFAULT_CANVA_SIZE_COLOR = 60; // Canva 字級 60 — solid-color frame

function canvaToPx(canvaSize) {
  return canvaSize * CANVA_TO_PX;
}

function defaultCanvaSizeFor(bgType) {
  return bgType === 'color' ? DEFAULT_CANVA_SIZE_COLOR : DEFAULT_CANVA_SIZE_IMAGE;
}

function getFontSizePx() {
  return canvaToPx(Number(fontSizeInput.value));
}

function fitFontSize(targetCtx, lines, maxWidth, baseSize) {
  let size = baseSize;
  targetCtx.font = `${size}px ${FONT_STACK}`;
  const widest = Math.max(...lines.map(l => targetCtx.measureText(l).width));
  if (widest > maxWidth) {
    size = Math.max(24, Math.floor(size * maxWidth / widest));
  }
  return size;
}

function parseLines(titleText) {
  return titleText.replace(/\r/g, '').split('\n').filter(l => l.trim().length > 0);
}

function drawTitle(targetCtx, lines, baseSize, centerY) {
  if (lines.length === 0) return;

  const paddingX = 60;
  const maxWidth = SIZE - paddingX * 2;
  const fontSize = fitFontSize(targetCtx, lines, maxWidth, baseSize);
  const lineHeight = fontSize * LINE_HEIGHT_RATIO;
  const n = lines.length;

  targetCtx.textAlign = 'center';
  targetCtx.textBaseline = 'middle';
  targetCtx.font = `${fontSize}px ${FONT_STACK}`;

  lines.forEach((line, i) => {
    const y = centerY - (n - 1) * lineHeight / 2 + i * lineHeight;
    targetCtx.fillStyle = '#ffffff';
    targetCtx.fillText(line, SIZE / 2, y);
  });
}

// source: { type: 'image', image } | { type: 'color', color }
// frame: 'entertainment' (pink) | 'news' (blue) — only affects the image-mode corner ribbon
function renderComposite(targetCtx, source, titleText, fontSize, frame) {
  targetCtx.clearRect(0, 0, SIZE, SIZE);
  if (source && source.type === 'color') {
    targetCtx.fillStyle = source.color;
    targetCtx.fillRect(0, 0, SIZE, SIZE);
    drawLogoBottom(targetCtx);
    drawTitle(targetCtx, parseLines(titleText), fontSize, SIZE / 2);
  } else {
    drawImageCover(targetCtx, source.image);
    drawGradient(targetCtx);
    drawRibbon(targetCtx, frame);
    drawTitle(targetCtx, parseLines(titleText), fontSize, BOX_CENTER);
  }
}

function hasBackground(source) {
  return !!source && ((source.type === 'color' && source.color) || (source.type === 'image' && source.image));
}

let singleBg = { type: 'image', image: null, color: null };
let singleFrame = 'entertainment';

function render() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const ready = hasBackground(singleBg);
  if (ready) {
    renderComposite(ctx, singleBg, titleEl.value, getFontSizePx(), singleFrame);
  }
  downloadBtn.disabled = !(ready && titleEl.value.trim().length > 0);
  statusEl.textContent = ready
    ? (titleEl.value.trim() ? '預覽已更新' : '請輸入標題')
    : '請先上傳圖片或選擇純色背景，並輸入標題';
}

const IMAGE_EXT_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|heic|heif)$/i;

function isImageFile(file) {
  if (!file) return false;
  if (file.type && file.type.startsWith('image/')) return true;
  // some browsers/OS report no MIME type for certain formats (e.g. HEIC) — fall back to extension
  return IMAGE_EXT_RE.test(file.name || '');
}

// Reusable background picker: "upload image" vs "solid color" toggle, used by
// single mode and by each batch item block.
function createBackgroundPicker(opts) {
  const root = document.createElement('div');

  const toggle = document.createElement('div');
  toggle.className = 'bg-toggle';
  const btnImage = document.createElement('button');
  btnImage.type = 'button';
  btnImage.textContent = '上傳圖片';
  btnImage.className = 'active';
  const btnColor = document.createElement('button');
  btnColor.type = 'button';
  btnColor.textContent = '純色背景';
  toggle.appendChild(btnImage);
  toggle.appendChild(btnColor);

  const imageSection = document.createElement('div');
  const dz = document.createElement('div');
  dz.className = 'dropzone';
  dz.tabIndex = 0;
  const thumb = document.createElement('img');
  thumb.className = 'batch-item-thumb';
  thumb.style.display = 'none';
  const dzText = document.createElement('div');
  dzText.textContent = '點擊選擇圖片，或拖曳／貼上（Ctrl+V）圖片到此處';
  const fi = document.createElement('input');
  fi.type = 'file';
  fi.accept = 'image/*';
  dz.appendChild(thumb);
  dz.appendChild(dzText);
  dz.appendChild(fi);
  const hint = document.createElement('div');
  hint.className = 'hint';
  imageSection.appendChild(dz);
  imageSection.appendChild(hint);

  const colorSection = document.createElement('div');
  colorSection.className = 'color-swatches';
  colorSection.style.display = 'none';
  let selectedSwatch = null;
  PRESET_COLORS.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = hex;
    sw.title = hex;
    sw.addEventListener('click', () => {
      if (selectedSwatch) selectedSwatch.classList.remove('selected');
      sw.classList.add('selected');
      selectedSwatch = sw;
      opts.onColor(hex);
    });
    colorSection.appendChild(sw);
  });

  function setModeVisual(mode) {
    const isColor = mode === 'color';
    btnImage.classList.toggle('active', !isColor);
    btnColor.classList.toggle('active', isColor);
    imageSection.style.display = isColor ? 'none' : '';
    colorSection.style.display = isColor ? 'flex' : 'none';
  }
  function setMode(mode) {
    setModeVisual(mode);
    if (opts.onModeChange) opts.onModeChange(mode);
  }
  btnImage.addEventListener('click', () => setMode('image'));
  btnColor.addEventListener('click', () => setMode('color'));

  function handleFile(file) {
    if (!isImageFile(file)) {
      hint.textContent = file ? `無法辨識「${file.name}」為圖片檔` : '';
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => { hint.textContent = `讀取「${file.name}」失敗，請換一張圖片`; };
    reader.onload = e => {
      const image = new Image();
      image.onerror = () => { hint.textContent = `「${file.name}」無法開啟，可能是不支援的圖片格式（例如 HEIC），請改用 JPG/PNG`; };
      image.onload = () => {
        thumb.src = image.src;
        thumb.style.display = 'block';
        dzText.style.display = 'none';
        hint.textContent = `已載入：${file.name}`;
        opts.onImage(image, file.name);
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('focus', () => { if (opts.onFocus) opts.onFocus(); });
  fi.addEventListener('change', e => handleFile(e.target.files[0]));
  dz.addEventListener('dragover', e => {
    e.preventDefault();
    dz.classList.add('drag');
    if (opts.onFocus) opts.onFocus();
  });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag');
    if (opts.onFocus) opts.onFocus();
    handleFile(e.dataTransfer.files[0]);
  });

  root.appendChild(toggle);
  root.appendChild(imageSection);
  root.appendChild(colorSection);

  function restoreImage(image, fileName) {
    setModeVisual('image');
    thumb.src = image.src;
    thumb.style.display = 'block';
    dzText.style.display = 'none';
    hint.textContent = `已載入：${fileName}`;
  }

  function restoreColor(hex) {
    setModeVisual('color');
    const sw = Array.from(colorSection.children).find(el => el.title === hex);
    if (sw) {
      if (selectedSwatch) selectedSwatch.classList.remove('selected');
      sw.classList.add('selected');
      selectedSwatch = sw;
    }
  }

  return { root, handleFile, setMode, restoreImage, restoreColor };
}

let singleFontSizeTouched = false;

function applyDefaultFontSize(bgType) {
  if (singleFontSizeTouched) return;
  const canvaSize = defaultCanvaSizeFor(bgType);
  fontSizeInput.value = canvaSize;
  fontSizeVal.textContent = canvaSize;
}

const singleBgPicker = createBackgroundPicker({
  onImage: image => {
    singleBg = { type: 'image', image, color: null };
    applyDefaultFontSize('image');
    render();
  },
  onColor: color => {
    singleBg = { type: 'color', image: null, color };
    applyDefaultFontSize('color');
    render();
  },
  onModeChange: mode => {
    singleBg = mode === 'color' ? { type: 'color', image: null, color: null } : { type: 'image', image: null, color: null };
    applyDefaultFontSize(mode);
    render();
  }
});
document.getElementById('singleBgPicker').appendChild(singleBgPicker.root);

const singleFrameToggle = document.getElementById('singleFrameToggle');
singleFrameToggle.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    singleFrameToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    singleFrame = btn.dataset.frame;
    render();
  });
});

titleEl.addEventListener('input', render);
fontSizeInput.addEventListener('input', () => {
  singleFontSizeTouched = true;
  fontSizeVal.textContent = fontSizeInput.value;
  render();
});
ribbonReady.then(render);
ribbonNewsReady.then(render);
logoReady.then(render);
whzFontReady.then(render);
document.fonts.ready.then(render);

document.addEventListener('paste', e => {
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (currentMode === 'batch') {
        handleBatchPastedImage(file);
      } else {
        singleBgPicker.handleFile(file);
      }
      break;
    }
  }
});

function safeFilename(titleText, fallback) {
  const firstLine = titleText.split('\n').find(l => l.trim()) || fallback;
  const safe = firstLine.trim().slice(0, 20).replace(/[\\/:*?"<>|]/g, '');
  return safe || fallback;
}

function downloadCanvas(targetCanvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = targetCanvas.toDataURL('image/png');
  a.click();
}

downloadBtn.addEventListener('click', async () => {
  await whzFontReady;
  render();
  downloadCanvas(canvas, `${safeFilename(titleEl.value, '娛樂新聞圖')}.png`);
});

resetBtn.addEventListener('click', () => {
  singleBg = { type: 'image', image: null, color: null };
  singleBgPicker.setMode('image');
  singleFrame = 'entertainment';
  singleFrameToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.frame === 'entertainment'));
  singleFontSizeTouched = false;
  applyDefaultFontSize('image');
  titleEl.value = '';
  render();
});

render();

// ---- mode switching ----
const modeSingleBtn = document.getElementById('modeSingleBtn');
const modeBatchBtn = document.getElementById('modeBatchBtn');
const singleFields = document.getElementById('singleFields');
const batchFields = document.getElementById('batchFields');
const singlePreview = document.getElementById('singlePreview');
const batchPreview = document.getElementById('batchPreview');

let currentMode = 'single';

function setMode(mode) {
  currentMode = mode;
  const isBatch = mode === 'batch';
  modeSingleBtn.classList.toggle('active', !isBatch);
  modeBatchBtn.classList.toggle('active', isBatch);
  singleFields.style.display = isBatch ? 'none' : '';
  batchFields.style.display = isBatch ? '' : 'none';
  singlePreview.style.display = isBatch ? 'none' : '';
  batchPreview.style.display = isBatch ? '' : 'none';
}
modeSingleBtn.addEventListener('click', () => setMode('single'));
modeBatchBtn.addEventListener('click', () => setMode('batch'));

// ---- batch mode (one block per image) ----
const batchItemsList = document.getElementById('batchItemsList');
const addBatchItemBtn = document.getElementById('addBatchItemBtn');
const batchGenerateBtn = document.getElementById('batchGenerateBtn');
const batchDownloadAllBtn = document.getElementById('batchDownloadAllBtn');
const batchResetBtn = document.getElementById('batchResetBtn');
const batchCanvas = document.getElementById('batchCanvas');
const batchCtx = batchCanvas.getContext('2d');
const batchStatus = document.getElementById('batchStatus');

let batchItems = [];   // { id, title, bg: {type,image,color}, frame, fontSize, fontSizeTouched, done, resultDataUrl, resultFilename }
let batchIdCounter = 0;
let activeBatchItemId = null;

function addBatchItem() {
  const item = {
    id: ++batchIdCounter, title: '',
    bg: { type: 'image', image: null, color: null },
    frame: 'entertainment',
    fontSize: DEFAULT_CANVA_SIZE_IMAGE, fontSizeTouched: false,
    done: false, resultDataUrl: null, resultFilename: null
  };
  batchItems.push(item);
  batchItemsList.appendChild(buildBatchItemBlock(item, batchItems.length - 1));
}

function removeBatchItem(id) {
  const node = batchItemsList.querySelector(`[data-item-id="${id}"]`);
  batchItems = batchItems.filter(it => it.id !== id);
  if (node) node.remove();
  renumberBatchItems();
}

// Renumber the "#N" labels on remaining nodes in place, without rebuilding
// them — a full rebuild would tear down and recreate every block, which
// steals focus/scroll position (the browser jumps when a focused/clicked
// element is removed from the DOM).
function renumberBatchItems() {
  batchItems.forEach((item, index) => {
    const node = batchItemsList.querySelector(`[data-item-id="${item.id}"]`);
    if (!node) return;
    const label = node.querySelector('.label, .row-title');
    if (!label) return;
    if (node.classList.contains('batch-item-row')) {
      const firstLine = item.title.split('\n').find(l => l.trim()) || '';
      label.textContent = `#${index + 1} ${firstLine}`;
    } else {
      label.textContent = `圖片 #${index + 1}`;
    }
  });
}

// Replace only this item's own node in place (keeps every other block/row
// untouched, so the page doesn't jump or lose focus elsewhere).
function refreshBatchItem(item) {
  const index = batchItems.indexOf(item);
  const oldNode = batchItemsList.querySelector(`[data-item-id="${item.id}"]`);
  const newNode = buildBatchItemBlock(item, index);
  if (oldNode) oldNode.replaceWith(newNode);
  else batchItemsList.appendChild(newNode);
}

// Live-preview this item into the shared batch canvas as its fields change
// (font size, title, frame, background) — without marking it done or saving
// a result, so editing gives the same immediate feedback as single mode.
async function previewBatchItem(item) {
  if (!hasBackground(item.bg)) return;
  await whzFontReady;
  const fontSize = canvaToPx(item.fontSize);
  renderComposite(batchCtx, item.bg, item.title, fontSize, item.frame);
  const index = batchItems.indexOf(item);
  batchStatus.textContent = `預覽中（尚未完成）：圖片 #${index + 1}`;
}

async function completeBatchItem(item) {
  if (!hasBackground(item.bg) || !item.title.trim()) {
    item.errorMsg = '需要同時有標題和背景（圖片或純色）才能完成';
    refreshBatchItem(item);
    return false;
  }
  item.errorMsg = null;
  await whzFontReady;
  const fontSize = canvaToPx(item.fontSize);
  renderComposite(batchCtx, item.bg, item.title, fontSize, item.frame);
  const index = batchItems.indexOf(item);
  item.resultFilename = `${String(index + 1).padStart(2, '0')}_${safeFilename(item.title, '娛樂新聞圖' + (index + 1))}.png`;
  item.resultDataUrl = batchCanvas.toDataURL('image/png');
  item.done = true;
  batchStatus.textContent = `預覽已更新：${item.resultFilename}`;
  batchDownloadAllBtn.disabled = !batchItems.some(it => it.done && it.resultDataUrl);
  refreshBatchItem(item);
  return true;
}

function editBatchItem(item) {
  item.done = false;
  refreshBatchItem(item);
}

function buildBatchItemRow(item, index) {
  const row = document.createElement('div');
  row.className = 'batch-item-row';
  row.dataset.itemId = item.id;

  const thumb = document.createElement('img');
  thumb.className = 'row-thumb';
  thumb.src = item.resultDataUrl;

  const title = document.createElement('div');
  title.className = 'row-title';
  const firstLine = item.title.split('\n').find(l => l.trim()) || '';
  title.textContent = `#${index + 1} ${firstLine}`;

  const badge = document.createElement('span');
  badge.className = 'row-badge';
  badge.textContent = '✓ 已完成';

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'row-remove';
  removeBtn.textContent = '移除';
  removeBtn.addEventListener('click', e => { e.stopPropagation(); removeBatchItem(item.id); });

  row.appendChild(thumb);
  row.appendChild(title);
  row.appendChild(badge);
  row.appendChild(removeBtn);
  row.addEventListener('click', () => editBatchItem(item));
  return row;
}

function buildBatchItemBlock(item, index) {
  if (item.done) {
    return buildBatchItemRow(item, index);
  }

  const block = document.createElement('div');
  block.className = 'batch-item-block';
  block.dataset.itemId = item.id;

  const head = document.createElement('div');
  head.className = 'batch-item-head';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = `圖片 #${index + 1}`;
  const headBtns = document.createElement('div');
  headBtns.style.display = 'flex';
  headBtns.style.gap = '6px';
  const completeBtn = document.createElement('button');
  completeBtn.type = 'button';
  completeBtn.className = 'primary';
  completeBtn.textContent = '完成';
  completeBtn.addEventListener('click', () => completeBatchItem(item));
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.textContent = '移除';
  removeBtn.addEventListener('click', () => removeBatchItem(item.id));
  headBtns.appendChild(completeBtn);
  headBtns.appendChild(removeBtn);
  head.appendChild(label);
  head.appendChild(headBtns);

  const frameToggle = document.createElement('div');
  frameToggle.className = 'bg-toggle';
  const frameEnt = document.createElement('button');
  frameEnt.type = 'button';
  frameEnt.textContent = '娛樂（粉框）';
  const frameNews = document.createElement('button');
  frameNews.type = 'button';
  frameNews.textContent = '新聞（藍框）';
  frameToggle.appendChild(frameNews);
  frameToggle.appendChild(frameEnt);
  function setFrameVisual(frame) {
    frameEnt.classList.toggle('active', frame !== 'news');
    frameNews.classList.toggle('active', frame === 'news');
  }
  setFrameVisual(item.frame);
  frameEnt.addEventListener('click', () => { item.frame = 'entertainment'; setFrameVisual('entertainment'); previewBatchItem(item); });
  frameNews.addEventListener('click', () => { item.frame = 'news'; setFrameVisual('news'); previewBatchItem(item); });

  const textarea = document.createElement('textarea');
  textarea.placeholder = '標題（Enter 換行）';
  textarea.value = item.title;
  textarea.addEventListener('input', () => { item.title = textarea.value; previewBatchItem(item); });
  textarea.addEventListener('focus', () => { activeBatchItemId = item.id; });

  const fontSizeField = document.createElement('div');
  fontSizeField.className = 'field';
  const fontSizeLabel = document.createElement('label');
  fontSizeLabel.textContent = '字級（對照 Canva 字級）';
  const fontSizeSlider = document.createElement('input');
  fontSizeSlider.type = 'range';
  fontSizeSlider.min = '50';
  fontSizeSlider.max = '70';
  fontSizeSlider.value = String(item.fontSize);
  fontSizeSlider.style.width = '100%';
  const fontSizeHint = document.createElement('div');
  fontSizeHint.className = 'hint';
  fontSizeHint.textContent = `目前 Canva 字級 ${item.fontSize}（未調整時依背景類型自動預設：圖片 50／純色 60）`;
  fontSizeSlider.addEventListener('input', () => {
    item.fontSizeTouched = true;
    item.fontSize = Number(fontSizeSlider.value);
    fontSizeHint.textContent = `目前 Canva 字級 ${item.fontSize}（未調整時依背景類型自動預設：圖片 50／純色 60）`;
    previewBatchItem(item);
  });
  fontSizeField.appendChild(fontSizeLabel);
  fontSizeField.appendChild(fontSizeSlider);
  fontSizeField.appendChild(fontSizeHint);

  const picker = createBackgroundPicker({
    onImage: (image, fileName) => { item.bg = { type: 'image', image, color: null }; item.fileName = fileName; previewBatchItem(item); },
    onColor: color => { item.bg = { type: 'color', image: null, color }; previewBatchItem(item); },
    onModeChange: mode => {
      item.bg = mode === 'color' ? { type: 'color', image: null, color: null } : { type: 'image', image: null, color: null };
      if (!item.fontSizeTouched) {
        item.fontSize = defaultCanvaSizeFor(mode);
        fontSizeSlider.value = String(item.fontSize);
        fontSizeHint.textContent = `目前 Canva 字級 ${item.fontSize}（未調整時依背景類型自動預設：圖片 50／純色 60）`;
      }
    },
    onFocus: () => { activeBatchItemId = item.id; }
  });
  item.handleFile = picker.handleFile; // used by global paste routing

  if (item.bg.type === 'color' && item.bg.color) {
    picker.restoreColor(item.bg.color);
  } else if (item.bg.type === 'image' && item.bg.image) {
    picker.restoreImage(item.bg.image, item.fileName || '');
  }

  const errorEl = document.createElement('div');
  errorEl.className = 'hint';
  if (item.errorMsg) {
    errorEl.textContent = item.errorMsg;
    errorEl.style.color = '#dc2626';
  }

  block.appendChild(head);
  block.appendChild(frameToggle);
  block.appendChild(textarea);
  block.appendChild(fontSizeField);
  block.appendChild(picker.root);
  block.appendChild(errorEl);
  return block;
}

function renderBatchItemsList() {
  batchItemsList.innerHTML = '';
  batchItems.forEach((item, index) => {
    batchItemsList.appendChild(buildBatchItemBlock(item, index));
  });
}

function handleBatchPastedImage(file) {
  const target = batchItems.find(it => it.id === activeBatchItemId) || batchItems[batchItems.length - 1];
  if (target && target.handleFile) target.handleFile(file);
}

addBatchItemBtn.addEventListener('click', addBatchItem);

batchGenerateBtn.addEventListener('click', async () => {
  if (batchItems.length === 0) {
    batchStatus.textContent = '請先按「＋ 再做一張」新增至少一組';
    return;
  }
  const pending = batchItems.filter(it => !it.done);
  if (pending.length === 0) {
    batchStatus.textContent = '全部都已完成了';
    return;
  }
  let doneCount = 0;
  let skippedCount = 0;
  for (const item of pending) {
    if (await completeBatchItem(item)) doneCount++;
    else skippedCount++;
  }
  const skipNote = skippedCount > 0 ? `（${skippedCount} 組缺標題或背景，略過）` : '';
  batchStatus.textContent = `完成 ${doneCount} 組${skipNote}`;
});

batchDownloadAllBtn.addEventListener('click', async () => {
  const results = batchItems.filter(it => it.done && it.resultDataUrl);
  for (const item of results) {
    const a = document.createElement('a');
    a.download = item.resultFilename;
    a.href = item.resultDataUrl;
    a.click();
    await new Promise(res => setTimeout(res, 200));
  }
});

batchResetBtn.addEventListener('click', () => {
  batchItems = [];
  batchCtx.clearRect(0, 0, SIZE, SIZE);
  batchStatus.textContent = '按某一組的「完成」後，預覽會顯示在這裡';
  batchDownloadAllBtn.disabled = true;
  renderBatchItemsList();
});

addBatchItem(); // start with one block
</script>
